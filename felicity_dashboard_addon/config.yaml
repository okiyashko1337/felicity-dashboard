name: Felicity Energy Dashboard
version: "0.10.5"
slug: felicity_energy_dashboard
description: Local Felicity IVGM monitoring with history and Raspberry Pi metrics
url: https://github.com/okiyashko1337/felicity-dashboard
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8000
panel_icon: mdi:solar-power
panel_title: Felicity Energy
panel_admin: true
uart: true
ports:
  8000/tcp: null
ports_description:
  8000/tcp: Direct dashboard access (disabled by default; use Ingress)
backup: cold
options:
  inverter_host: 192.168.1.135
  inverter_port: 53970
  poll_interval: 2
  system_interval: 10
  nextion_enabled: false
  nextion_port: ""
  nextion_baudrate: 115200
schema:
  inverter_host: str
  inverter_port: int
  poll_interval: float
  system_interval: int
  nextion_enabled: bool
  nextion_port: str
  nextion_baudrate: int(2400,115200)

plugins { id 'com.android.application' }

android {
    namespace 'io.github.okiyashko1337.felicitydashboard'
    compileSdk 32

    defaultConfig {
        applicationId 'io.github.okiyashko1337.felicitydashboard'
        minSdk 23
        targetSdk 28
        versionCode 2
        versionName '0.15.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
}

dependencies { implementation 'org.videolan.android:libvlc-all:3.5.1' }
